name: modarchitect-249

services:
  database:
    image: ${POSTGRES_IMAGE:?set the pinned PostgreSQL image}
    pull_policy: never
    restart: unless-stopped
    env_file: database.env
    environment:
      POSTGRES_DB: modarchitect
    volumes:
      - research_data:/var/lib/postgresql
      - ./init-roles.sql:/docker-entrypoint-initdb.d/10-research-roles.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "modarchitect"]
      interval: 5s
      timeout: 3s
      retries: 12

  migration:
    image: ${APP_IMAGE:?set the application image}
    pull_policy: never
    env_file: migration.env
    command: ["modarchitect-db"]
    depends_on:
      database:
        condition: service_healthy

  api:
    image: ${APP_IMAGE:?set the application image}
    pull_policy: never
    restart: unless-stopped
    env_file: [api.env, runtime-api.env]
    volumes:
      - ./runtime-profiles.json:/etc/modarchitect/runtime-profiles.json:ro
    ports:
      - "${BIND_ADDRESS:?set the LAN address}:${API_PORT:?set the LAN port}:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()"
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    image: ${APP_IMAGE:?set the application image}
    pull_policy: never
    restart: unless-stopped
    user: "0:0"
    env_file: runtime-worker.env
    command: ["python", "-m", "uvicorn", "modarchitect.runtime.worker:app", "--host", "0.0.0.0", "--port", "8001"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runtime-profiles.json:/etc/modarchitect/runtime-profiles.json:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 5

  scheduler:
    image: ${APP_IMAGE:?set the application image}
    pull_policy: never
    restart: unless-stopped
    env_file: runtime-scheduler.env
    command: ["python", "-m", "modarchitect.runtime.scheduler"]
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy

volumes:
  research_data:
