name: modarchitect-dolphin-249

services:
  dolphin:
    image: sha256:5d3feccbac2317e738ab8caa68fd4e552d6808080e3cab749fe3f249b8145605
    pull_policy: never
    restart: unless-stopped
    user: "0:0"
    env_file: dolphin.env
    environment:
      MASTER_SERVER_LOAD_PROTECTION_MAX_DISK_USAGE_PERCENTAGE_THRESHOLDS: "0.85"
      WORKER_SERVER_LOAD_PROTECTION_MAX_DISK_USAGE_PERCENTAGE_THRESHOLDS: "0.85"
    command: ["/bin/bash", "/opt/dolphinscheduler/standalone-server/bin/start.sh"]
    ports:
      - "127.0.0.1:18927:12345"
      - "127.0.0.1:18948:25333"
    volumes:
      - ./dolphin/data:/scheduler-data
      - ./dolphin/work:/tmp/dolphinscheduler
      - ./dolphin/logs:/opt/dolphinscheduler/logs
      - ./dolphin/plugins:/opt/dolphinscheduler/plugins:ro
    mem_limit: 4g
    cpus: 2
    networks: [research]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:12345/dolphinscheduler/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  research:
    external: true
    name: modarchitect-249_default
